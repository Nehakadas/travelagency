<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to Wanderlust Travels to manage your bookings and explore exclusive travel deals.">
    <title>Login | Wanderlust Travels</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Auth Page Custom Styles */
        .auth-section {
            min-height: calc(100vh - 80px - 250px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
            background: var(--color-light);
        }
        .auth-card {
            background: var(--color-white);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .auth-card h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--color-dark);
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .auth-card p.subtitle {
            text-align: center;
            color: var(--color-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            color: var(--color-dark);
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            border: 1.5px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: border-color var(--transition);
        }
        .form-group input:focus {
            border-color: var(--color-accent);
        }
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }
        .form-options label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            color: var(--color-muted);
        }
        .form-options a {
            color: var(--color-accent);
            font-weight: 500;
        }
        .form-options a:hover {
            text-decoration: underline;
        }
        .auth-btn {
            width: 100%;
            padding: 0.85rem;
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-dark);
            background: var(--color-primary);
            border: none;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: background var(--transition);
        }
        .auth-btn:hover {
            background: var(--color-primary-dark);
        }
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--color-muted);
        }
        .auth-footer a {
            color: var(--color-accent);
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <nav id="navbar" aria-label="Main navigation">
            <div class="nav-brand">
                <a href="index.html" style="display:flex; align-items:center; gap:0.75rem;">
                    <img src="logo.png" alt="Wanderlust Travels logo" width="48" height="48">
                    <span class="brand-name">Travel Agency</span>
                </a>
            </div>

            <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle navigation menu">
                <span class="hamburger"></span>
            </button>

            <div id="nav-menu" class="nav-menu">
                <ul>
                    <li><a href="index.html#home">Home</a></li>
                    <li><a href="index.html#services">Services</a></li>
                    <li><a href="index.html#destinations">Destinations</a></li>
                    <li><a href="login.html">Login</a></li>
                </ul>
                <a href="signup.html" class="btn btn-outline">Sign Up</a>
            </div>
        </nav>
    </header>

    <main class="auth-section">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Log in to your Wanderlust account</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <label><input type="checkbox" name="remember"> Remember me</label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="auth-btn">Log In</button>
            </form>

            <p class="auth-footer">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </p>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2025 Wanderlust Travels. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const toggle = document.querySelector('.nav-toggle');
        const menu = document.getElementById('nav-menu');

        toggle.addEventListener('click', () => {
            const expanded = toggle.getAttribute('aria-expanded') === 'true';
            toggle.setAttribute('aria-expanded', !expanded);
            menu.classList.toggle('is-open');
        });
    </script>
</body>
</html>
